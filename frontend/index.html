<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>India Weather Prediction Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 340px; }
  #sidebar {
    position: absolute; top: 0; right: 0; width: 340px; height: 100%;
    background: #111827; color: #e5e7eb; padding: 16px; box-sizing: border-box;
    overflow-y: auto;
  }
  #sidebar h1 { font-size: 18px; margin-bottom: 4px; }
  #sidebar p.hint { font-size: 12px; color: #9ca3af; margin-top: 0; }
  .controls { margin: 12px 0; display: flex; gap: 8px; }
  button {
    background: #2563eb; color: white; border: none; padding: 6px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  button.secondary { background: #374151; }
  #detail { margin-top: 16px; border-top: 1px solid #374151; padding-top: 12px; }
  #detail h2 { font-size: 14px; margin-bottom: 8px; }
  canvas { max-width: 100%; }
  .legend {
    position: absolute; bottom: 20px; left: 20px; background: white;
    padding: 8px 12px; border-radius: 6px; font-size: 12px; z-index: 1000;
  }
  .legend .bar {
    width: 200px; height: 10px;
    background: linear-gradient(to right, #2166ac, #67a9cf, #fddbc7, #ef8a62, #b2182b);
    border-radius: 4px; margin-top: 4px;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="legend">
  <div>Temperature (°C)</div>
  <div class="bar"></div>
  <div style="display:flex; justify-content:space-between;"><span>Cold</span><span>Hot</span></div>
</div>

<div id="sidebar">
  <h1>India Weather Outlook</h1>
  <p class="hint">Click anywhere on the map for a 7-day hourly forecast + 30-day trend.</p>

  <div class="controls">
    <button id="viewGrid">Grid Heatmap</button>
    <button id="viewState" class="secondary">State Averages</button>
  </div>

  <div id="detail">
    <p class="hint">Nothing selected yet — click a point on the map.</p>
  </div>
</div>

<script>
// Backend URL (stripped of any trailing slash to prevent double-slash API routes)
const API_BASE = ("https://india-weather-api-ev9o.onrender.com").replace(/\/+$/, "");

const INDIA_BOUNDS = L.latLngBounds([6.0, 68.0], [37.5, 97.5]);

const map = L.map('map', {
  maxBounds: INDIA_BOUNDS.pad(0.15),
  maxBoundsViscosity: 0.8,
  minZoom: 4,
}).fitBounds(INDIA_BOUNDS);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let heatLayer = null;
let stateLayer = null;
let marker = null;

// --- Mask everything outside India + draw the official outline -----------
async function loadIndiaMask() {
  try {
    let indiaGeojson = null;
    try {
      const res = await fetch("./india_geojson.json");
      if (res.ok) indiaGeojson = await res.json();
    } catch (e) {
      console.warn("Local india_geojson.json fetch error, trying external fallback...");
    }

    if (!indiaGeojson) {
      const fallbackUrl = "https://raw.githubusercontent.com/geohacker/india/master/state/india_state.geojson";
      const res = await fetch(fallbackUrl);
      if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
      indiaGeojson = await res.json();
    }

    console.log("India boundary loaded:", indiaGeojson.features?.length, "feature(s)");

    // turf.mask() returns a world-covering polygon with India cut out as a
    // hole — rendering that as a semi-opaque fill grays out everything
    // that isn't India, without touching India itself.
    const masked = turf.mask(indiaGeojson);
    L.geoJSON(masked, {
      style: { color: 'none', fillColor: '#374151', fillOpacity: 0.82 },
      interactive: false,
    }).addTo(map);

    // Draw India's official state/national boundaries on top.
    L.geoJSON(indiaGeojson, {
      style: { color: '#1d4ed8', weight: 1.2, fillOpacity: 0 },
      interactive: false,
    }).addTo(map);

    console.log("India mask + outline rendered successfully");
  } catch (err) {
    console.error("Failed to load/render India mask:", err);
  }
}
loadIndiaMask();

// --- Grid heatmap view ------------------------------------------------
async function loadGridHeatmap() {
  if (stateLayer) { map.removeLayer(stateLayer); stateLayer = null; }
  if (heatLayer) { map.removeLayer(heatLayer); }

  try {
    const res = await fetch(`${API_BASE}/predict/grid`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const points = (data.points || [])
      .filter(p => p.temp !== null && p.temp !== undefined)
      .map(p => [p.lat, p.lon, p.temp]);

    if (points.length > 0) {
      heatLayer = L.heatLayer(points, { radius: 18, blur: 22, maxZoom: 7 }).addTo(map);
    }
  } catch (err) {
    console.error("Failed to load grid heatmap:", err);
  }
}

// --- State average view ------------------------------------------------
async function loadStateAverages() {
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  if (stateLayer) { map.removeLayer(stateLayer); stateLayer = null; }

  try {
    const res = await fetch(`${API_BASE}/predict/state-avg`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    console.log("State averages:", data.states);
  } catch (err) {
    console.error("Failed to load state averages:", err);
  }
}

document.getElementById('viewGrid').onclick = loadGridHeatmap;
document.getElementById('viewState').onclick = loadStateAverages;

// --- Click-to-drill-down ------------------------------------------------
map.on('click', async (e) => {
  const { lat, lng } = e.latlng;

  if (marker) map.removeLayer(marker);
  marker = L.marker([lat, lng]).addTo(map);

  const detail = document.getElementById('detail');
  detail.innerHTML = `<p class="hint">Loading forecast for (${lat.toFixed(2)}, ${lng.toFixed(2)})...</p>`;

  try {
    const res = await fetch(`${API_BASE}/predict/point?lat=${lat}&lon=${lng}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    detail.innerHTML = `
      <h2>${data.state ?? 'Selected Location'}</h2>
      <p class="hint">Nearest grid point: ${data.nearest_grid_point?.lat ?? lat.toFixed(2)}, ${data.nearest_grid_point?.lon ?? lng.toFixed(2)}</p>
      <canvas id="trendChart" height="180"></canvas>
    `;

    const ctx = document.getElementById('trendChart').getContext('2d');
    const trend = data.forecast_30day_trend || [];
    const hourly = data.forecast_7day_hourly || [];

    const chartData = trend.length > 0 ? trend : hourly;
    const labels = chartData.map(d => d.date || d.time?.split('T')[1]?.substring(0, 5) || d.time?.split('T')[0] || '');
    const temps = chartData.map(d => d.predicted_temp);

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: trend.length > 0 ? '30-day outlook (°C)' : '7-day forecast (°C)',
            data: temps,
            borderColor: '#f59e0b',
            tension: 0.3,
          },
        ]
      },
      options: {
        plugins: { legend: { labels: { color: '#e5e7eb' } } },
        scales: {
          x: { ticks: { color: '#9ca3af', maxTicksLimit: 6 } },
          y: { ticks: { color: '#9ca3af' } },
        }
      }
    });
  } catch (err) {
    detail.innerHTML = `<p class="hint">Could not load forecast. Is the backend running at ${API_BASE}?</p>`;
    console.error(err);
  }
});

// Initial load
loadGridHeatmap();
</script>

</body>
</html>
