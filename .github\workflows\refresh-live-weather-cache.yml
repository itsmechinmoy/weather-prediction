name: Refresh Live Weather Cache

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

# Prevents two runs overlapping if one takes longer than an hour or you
# trigger manually while the scheduled run is still going.
concurrency:
  group: refresh-live-weather-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-fetch.txt

      - name: Install lightweight dependencies
        # update_latest.py only needs requests/pandas/numpy/pyarrow — installing
        # the full requirements.txt here would drag in xgboost/prophet just to
        # run a data-fetch script, slowing every hourly run down for no reason.
        run: pip install -r backend/requirements-fetch.txt

      - name: Run update_latest.py
        working-directory: backend
        run: python -m app.update_latest

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/latest_features.parquet
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh live weather cache [skip ci]"
            git push
          fi
